<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><title>Nova · Voice Generator</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><header><p class="eyebrow">VOICE STUDIO</p><h1>Voice Generator</h1><p class="subtitle">Natural, expressive voices. Built for conversation.</p></header><section class="card"><label for="profile">Voice personality</label><select id="profile"><option value="nova" selected>Nova — Soft, warm female (default)</option><option value="harbour">Harbour — Calm Canadian male</option></select><label for="deviceVoice" class="secondary-label">Device voice (fallback)</label><select id="deviceVoice"><option value="">Automatic (best match)</option></select><p class="hint">Neural voice is used when configured. Otherwise your device's available voice is used.</p></section><section class="card"><label for="text">What should she say?</label><textarea id="text" rows="4" placeholder="Write something to say…">Hi there. It's lovely to meet you. I'm Nova. Take your time, I'm here to help.</textarea></section><section class="card controls"><div><label for="rate">Pace <span id="rateVal">0.94</span></label><input type="range" id="rate" min="0.6" max="1.4" step="0.02" value="0.94"></div><div><label for="pitch">Pitch <span id="pitchVal">1.03</span></label><input type="range" id="pitch" min="0.7" max="1.3" step="0.01" value="1.03"></div><div><label for="volume">Volume <span id="volumeVal">1</span></label><input type="range" id="volume" min="0" max="1" step="0.05" value="1"></div></section><section class="actions"><button id="speak" class="primary">▶ Generate Voice</button><button id="stop">Stop</button></section><p id="status" role="status" aria-live="polite">Ready</p><details class="card"><summary>Voice direction prompt</summary><pre id="promptPreview"></pre><button id="copyPrompt">Copy Grok Prompt</button></details></main><script src="app.js"></script></body></html>
